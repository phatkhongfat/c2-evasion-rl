# Minimal Snort config for offline pcap analysis
# Botnet detection validation

# Paths
var RULE_PATH /root/.hermes/c2-evasion-rl/snort_validation/rules
var SO_RULE_PATH $RULE_PATH
var PREPROC_RULE_PATH $RULE_PATH

# Networks (adjust if needed)
var HOME_NET any
var EXTERNAL_NET any

# Ports
var HTTP_PORTS 80
var HTTPS_PORTS 443
var SSH_PORTS 22

# Output: unified2 format for parsing
output unified2: filename snort.log, limit 128

# Preprocessors (minimal, required for most rules)
preprocessor frag3_global: max_frags 65536
preprocessor frag3_engine: policy first detect_anomalies
preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp no
preprocessor stream5_tcp: policy first, use_static_footprint_sizes
preprocessor stream5_udp: ignore_any_rules

# Load botnet rules
include $RULE_PATH/emerging-botcc.rules
