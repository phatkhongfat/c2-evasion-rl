# Minimal Snort config for offline pcap analysis
# Botnet detection validation
#
# Used only for POST-TRAINING validation (never during RL training).

# Paths
var RULE_PATH /root/.hermes/c2-evasion-rl/snort_validation/rules
var SO_RULE_PATH $RULE_PATH
var PREPROC_RULE_PATH $RULE_PATH

# Networks (any — synthetic addresses in validation pcaps)
var HOME_NET any
var EXTERNAL_NET any

# Ports
var HTTP_PORTS 80
var HTTPS_PORTS 443
var SSH_PORTS 22

# Output: fast alert (CLI overrides with -A fast anyway)
output alert_fast: alert

# Classification / reference (required by rule classtype & reference keywords)
include $RULE_PATH/classification.config
include $RULE_PATH/reference.config

# Preprocessors (minimal, required for flow:established rules)
preprocessor frag3_global: max_frags 65536
preprocessor frag3_engine: policy first detect_anomalies
preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp yes
preprocessor stream5_tcp: policy first, use_static_footprint_sizes
preprocessor stream5_udp:

# Load botnet rules
include $RULE_PATH/emerging-botcc.rules
include $RULE_PATH/botnet-behavior.rules