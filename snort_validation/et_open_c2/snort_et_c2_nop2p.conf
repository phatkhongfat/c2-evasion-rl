# Minimal Snort 2.9 config for the ET Open C2 subset.
#
# Used for POST-TRAINING validation and for computing real Snort verdicts
# during training. Rules are ET Open (third-party), not hand-written.
#
# DIFFERS FROM snort_et_c2.conf BY:
#   var ET_C2_RULES -> et_open_c2_nop2p.rules, which drops the 102
#   classtype:policy-violation rules (ET P2P BitTorrent DHT, sid 2008581/83/85).
#   21419 -> 21317 lines. Regenerate with:
#     python controls/build_c2_only_ruleset.py
# Reason: P2P rules are not C2 and must not be counted as detection of the
# thing being measured -- see docs/THREAT_MODEL.md, "P2P rules are out of
# threat model (P11, measured)". Measured: with these rules gone, 16/16 http
# flows still alert on sid 2012627 (real C2) while 24/24 neris flows go silent,
# because those 24 had no C2 baseline at all.

var RULE_PATH /root/.hermes/c2-evasion-rl/snort_validation/rules
var SO_RULE_PATH $RULE_PATH
var PREPROC_RULE_PATH $RULE_PATH
var ET_C2_RULES /root/.hermes/c2-evasion-rl/snort_validation/et_open_c2/et_open_c2_nop2p.rules

# --- Networks ---------------------------------------------------------------
# Real captured traffic: everything is "home" so that rules written for both
# directions can fire. The capture has no notion of our perimeter.
var HOME_NET any
var EXTERNAL_NET any

# --- Server/service variables required by ET rules --------------------------
# These must be *defined* or Snort exits fatally on `![$A,$B]` syntax.
# NOTE: `any` cannot be used for a *negated* list (`!any is not allowed`), so
# the server variables that appear negated get a concrete RFC5737 documentation
# address. Captured traffic never uses it, so a rule like
# `![$SMTP_SERVERS,$DNS_SERVERS] -> $DNS_SERVERS` behaves as "not a known mail
# server", which is what the rule author intended.
var DNS_SERVERS 192.0.2.11
var HTTP_SERVERS any
var SMTP_SERVERS 192.0.2.10
var SQL_SERVERS any
var FTP_PORTS 21
var HTTP_PORTS 80
var HTTPS_PORTS 443
var SSH_PORTS 22
var WALLETS_START 1000

# --- Output -----------------------------------------------------------------
output alert_fast: alert

# --- Classification / reference (required by classtype & reference keywords) -
include $RULE_PATH/classification.config
include $RULE_PATH/reference.config

# --- Preprocessors ----------------------------------------------------------
preprocessor frag3_global: max_frags 65536
preprocessor frag3_engine: policy first detect_anomalies
preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp yes
preprocessor stream5_tcp: policy first, use_static_footprint_sizes
preprocessor stream5_udp:

# --- ET Open C2 ruleset -----------------------------------------------------
include $ET_C2_RULES
