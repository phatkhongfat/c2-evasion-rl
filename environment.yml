name: rl_c2_evasion
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # 1. Core Python & System
  - python=3.10
  - pip

  # 2. Data Science & Machine Learning
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - pyarrow
  - joblib

  # 3. Deep Learning (PyTorch - Bản CPU mặc định để tránh lỗi nặng máy)
  - pytorch
  - torchvision
  - torchaudio
  - cpuonly

  # 4. Utilities & Networking
  - requests
  - beautifulsoup4
  - tqdm
  - pyyaml

  # 5. Jupyter Workspace
  - jupyterlab
  - notebook
  - ipython

  # 6. Specific Versions via PIP (Chính xác như máy cũ của bạn)
  - pip:
      - gymnasium==1.3.0
      - stable-baselines3==2.9.0
      - tensorboard==2.21.0
      - scapy==2.7.0
      - flask==3.1.3
      - opencv-python==5.0.0.93
      - rich==15.0.0
