# Conda environment for the packet-level C2-evasion pipeline.
#
#   conda env create -f environment.yml
#   conda activate rl_c2_evasion
#   python setup_check.py
#   python -m pytest tests/ -q
#
# Versions below are the ones the project was actually measured on, taken from
# the .venv the documented results were produced with. The bounds exist to catch
# breaking major releases, not to reproduce bit-for-bit.
#
# Deliberately absent, and why:
#   * netfilterqueue / NFQUEUE is used only by red_team/ (live packet capture on
#     Linux, needs CAP_NET_ADMIN). A plain `conda env create` on a machine
#     without libnetfilter_queue fails on it, so it is documented as an extra.
#   * No plotting, notebook, or experiment-tracking packages. Nothing in the
#     codebase imports them. A previous version of this file listed ~20 of
#     them, which made the environment take far longer to install than the
#     project actually needs.
#   * No black/flake8/mypy: the repo has no committed lint configuration, so
#     pinning versions of tools nothing runs would be a false guarantee.
name: rl_c2_evasion
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # --- numerics (versions actually measured, not the ones that were guessed) ---
  - numpy>=2.0,<3.0            # measured on 2.4.6
  - pandas>=2.2,<4.0           # measured on 3.0.6
  - scipy>=1.11,<2.0           # measured on 1.17.1
  - scikit-learn>=1.4,<2.0     # measured on 1.9.1
  - pyarrow>=15.0              # parquet engine for pool_loader + dataset builders
  - joblib>=1.3,<2.0           # measured on 1.6.0
  - xgboost>=2.0,<4.0          # measured on 3.2.0, surrogate IDS

  # --- torch: CPU build, matching the torch==2.14.0+cpu the results came from --
  # For GPU, replace the line below with:
  #   - pytorch::pytorch=2.14.*=cuda126
  - pytorch::pytorch=2.14.*=cpu

  - pip:
      # --- packet handling -----------------------------------------------------
      - scapy==2.7.0            # packet mutation, pcap parsing, feature extraction

      # --- RL (packet-level policy, PPO, and the SB3 sweep harness) ------------
      - stable-baselines3==2.9.0
      - gymnasium==1.3.0

      # --- red team: local mock C2 server (red_team/mock_server.py) -------------
      - flask==3.1.3

      # --- tests ----------------------------------------------------------------
      - pytest==9.1.1

# ============================================================================
# OPTIONAL EXTRA: live packet interception
#
#   conda activate rl_c2_evasion
#   pip install NetfilterQueue
#
# Only needed by red_team/interceptor.py and red_team/live_interceptor.py.
# Those need root and a kernel module (libnetfilter_queue). They are not part
# of the validation path, so they stay out of the base environment.
# ============================================================================
#
# EXTRAS (install manually only if you need them)
#   - matplotlib    : ad-hoc plots only; no module in the repo imports it
#   - tensorboard   : pulled in automatically by stable-baselines3
#
# NOTE: Snort is a SYSTEM dependency and cannot be installed from conda.
#       The validation path needs Snort 2.9.20 on PATH and the ET Open C2
#       ruleset at snort_validation/et_open_c2/et_open_c2.rules.
#
#       Run at most ONE resident Snort instance at a time. They all share
#       iface lo, and concurrent instances silently corrupt each other's
#       results -- that failure mode is wrong numbers, not a crash, and it
#       cost a full round of re-measurement to diagnose.
#
# DATA: the capture pcaps are not in git (repo is public, the captures are
#       hundreds of MB, and the CTU-13 licence forbids redistribution).
#       Fetch them after cloning:
#         bash snort_validation/fetch_stratosphere.sh            # CTU-13
#         bash snort_validation/fetch_stratosphere_captures.sh 43 # MCFP
#
# NOTE ON entry points: the Makefile targets are stale -- they invoke the
#   flow-level PPO trainer (ai_agent/train_agent.py) and call bare `python3`.
#   The packet-level work runs through snort_validation/label_feasibility.py
#   and snort_validation/frontier_exact.py, and must be run with the env
#   interpreter explicitly: `python snort_validation/label_feasibility.py`.
