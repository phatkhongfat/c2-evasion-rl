# Snort 2.9 config for ET Open 3.0.0 (P13 candidate A).
#
# UNFILTERED apart from 2 rules: Snort 2.9.20 rejects `!any`, and both rules
# using `!$HOME_NET` are ET SMTP POLICY spam heuristics, irrelevant to C2.
# 52456 -> 52454 active rules.
# snort_et_c2.conf is a 21374-rule C2-filtered extract; filtering harder would
# remove rules and could manufacture headroom by deletion rather than by any
# real coordination. Keeping the full set is the harder, honest test.
#
# Generated 2026-10-13 from emerging.rules.tar.gz
#   sha256 54cead46d842ef668c6f05f5adc767f537dacd34960bce6284826f568b0d83f1

var RULE_PATH /root/.hermes/c2-evasion-rl/snort_validation/rules
var SO_RULE_PATH $RULE_PATH
var PREPROC_RULE_PATH $RULE_PATH
var ET3000_RULES /root/.hermes/c2-evasion-rl/rulesets/p13/et_open_3000.rules
# NB: the classification.config shipped inside the ET tarball is the empty
# template (comments only); the repo copy carries the 39 real entries. It must
# be pulled in with `include`, matching snort_et_c2.conf -- `config
# classification: <path>` is rejected by Snort 2.9.20.

# --- Networks ---------------------------------------------------------------
# Real captured traffic: everything is "home" so rules written for either
# direction can fire. The capture has no notion of our perimeter.
var HOME_NET any
var EXTERNAL_NET any

# --- Server/service variables ------------------------------------------------
# Negated lists (`![$X]`) reject `any`, so those get concrete RFC5737 addresses.
# Captured traffic never uses them, so `!$DNS_SERVERS` reads as "not a known
# mail server" -- what the rule author intended.
var DNS_SERVERS 192.0.2.11
var SMTP_SERVERS 192.0.2.10
var HTTP_SERVERS any
var SQL_SERVERS any
var AIM_SERVERS 192.0.2.12
var TELNET_SERVERS 192.0.2.13

# --- Ports -------------------------------------------------------------------
var FTP_PORTS 21
var HTTP_PORTS 80
var HTTPS_PORTS 443
var SSH_PORTS 22
var TELNET_PORTS 23
var ORACLE_PORTS 1521
var SHELLCODE_PORTS any
var DNP3_PORTS 20000
var MODBUS_PORTS 502
var FILEXFER_PORTS 21,445
var WALLETS_START 1000

# --- Output ------------------------------------------------------------------
output alert_fast: alert

# --- Classification / reference ---------------------------------------------
include $RULE_PATH/classification.config
include $RULE_PATH/reference.config

# --- Preprocessors -----------------------------------------------------------
preprocessor frag3_global: max_frags 65536
preprocessor frag3_engine: policy first detect_anomalies
preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp yes
preprocessor stream5_tcp: policy first, use_static_footprint_sizes
preprocessor stream5_udp:

# --- Ruleset -----------------------------------------------------------------
include $ET3000_RULES